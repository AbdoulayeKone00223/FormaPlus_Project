{% extends "base.html" %}
{% load static %}
{% block title %}Créer un compte{% endblock %}
{% block content %}

<div class="auth-wrapper">
  <div class="card auth-card">
    <div class="text-center mb-4">
      <img src="{% static 'img/logo.svg' %}" alt="FormaPlus" height="42" class="mb-2">
      <p class="text-muted small">Créez votre compte apprenant ou formateur</p>
    </div>

    <form method="post" novalidate>
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 shadow-sm justify-content-center mt-3">
        <i class="bi bi-person-check-fill me-1"></i> Créer mon compte
      </button>
    </form>

    <div class="text-center small mt-4 pt-3 border-top">
      <span class="text-muted">Déjà membre ?</span>
      <a class="fw-semibold text-primary text-decoration-none ms-1" href="{% url 'login' %}">Se connecter</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  (function () {
    var role = document.getElementById('id_role');
    var tel = document.getElementById('bloc-telephone');
    var spec = document.getElementById('bloc-specialite');
    function maj() {
      if (!role) return;
      var f = role.value === 'formateur';
      if (tel) tel.style.display = f ? 'none' : '';
      if (spec) spec.style.display = f ? '' : 'none';
    }
    if (role) {
      role.addEventListener('change', maj);
      maj();
    }
  })();
</script>
{% endblock %}
