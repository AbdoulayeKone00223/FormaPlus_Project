{% extends "base.html" %}
{% block title %}Accès non autorisé{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm text-center py-5 my-5 mx-auto" style="max-width: 520px;">
  <div class="card-body">
    <div class="p-3 bg-danger-subtle text-danger rounded-circle d-inline-flex mb-3">
      <i class="bi bi-shield-x fs-1"></i>
    </div>
    <h1 class="h3 fw-bold mb-2">Accès non autorisé</h1>
    <p class="text-muted mb-4">Vous n'avez pas les permissions nécessaires pour accéder à cette page ou exécuter cette action.</p>
    <a class="btn btn-primary rounded-pill px-4 shadow-sm" href="{% url 'dashboard' %}">
      <i class="bi bi-arrow-left me-1"></i> Retour au tableau de bord
    </a>
  </div>
</div>
{% endblock %}
